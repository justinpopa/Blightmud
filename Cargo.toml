[package]
name = "blightmud"
version = "5.4.0"
description = "A terminal mud-client"
readme = "README.md"
license = "GPL3"
authors = ["Linus Probert"]
edition = "2021"
build = "build.rs"

[lib]
doctest = false
crate-type = ["rlib"]

[features]
default = ["spellcheck"]
text-to-speech = ["tts"]
spellcheck = ["zspell"]

[dependencies]
libmudtelnet = "2.0.1"
crossterm = { git = "https://github.com/justinpopa/crossterm", branch = "dev" }
log = "0.4.28"
simple-logging = "2.0.2"
chrono = "0.4.42"
mlua =  { version = "0.11.4", features = ["lua54", "send", "vendored", "macros"] }
regex = "1.11.3"
strip-ansi-escapes = "0.2.1"
vte = "0.15.0"
timer = "0.2.0"
flate2 = "1.1.1"
pulldown-cmark-mdcat = { version = "2.7.1", default-features = false }
pulldown-cmark = "0.12.2"
syntect = "5.3.0"
serde = { version = "1.0.228", features = ['derive'] }
ron = "0.11.0"
anyhow = "1.0.100"
lazy_static = "1.5.0"
rs-complete = "1.3.1"
getopts = "0.2.24"
human-panic = "2.0.3"
tts = { version = "0.26.3", optional = true }
serde_json = "1.0.145"
git2 = "0.20.1"
rodio = "0.21.1"
notify-debouncer-mini = "0.6.0"
zspell = { version = "0.5", optional = true, features = ["unstable-suggestions"] }
rustls = { version = "0.23", default-features = false, features = ['ring', 'tls12', 'std'] }
webpki-roots = "1.0"
reqwest = { version = "0.12.23", default-features = false, features = ['blocking', '__rustls-ring', 'json'] }
socket2 = { version = "0.6.0", features = ['all'] }

[dev-dependencies]
mockall = "0.13.1"
mockall_double = "0.3.1"
rustls-pemfile = "2.2"
env_logger = "0.11.6"

[package.metadata.rpm]
package = "blightmud"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
blightmud = { path = "/usr/bin/blightmud" }
